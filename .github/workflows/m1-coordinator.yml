name: M1 Coordinator Contract

on:
  push:
    paths:
      - 'src/current/PCBridgePortable.cs'
      - 'src/current/ScopedBridge.cs'
      - 'src/current/DesktopIntegration.cs'
      - 'src/current/ScopeTests.cs'
      - 'src/current/IntegrationTests.cs'
      - 'src/current/M1Integration.cs'
      - 'src/vnext/M1Automation.cs'
      - 'tests/M1AutomationTests.cs'
      - 'src/vnext/M1BrowserProfile.cs'
      - 'tests/M1SessionBindingTests.cs'
      - 'tests/M1AutomationRuntimeTests.cs'
      - 'src/vnext/M1SessionBinding.cs'
      - 'src/vnext/M1AutomationRuntime.cs'
      - 'tests/M1BrowserProfileTests.cs'
      - 'tests/M1BrowserBrokerTests.cs'
      - 'src/vnext/M1BrowserBroker.cs'
      - 'provider/chatgpt-extension/**'
      - 'tests/m1-browser-companion-contract.mjs'
      - 'scripts/package-m1-companion.ps1'
      - 'scripts/build-m1-local.ps1'
      - '.github/workflows/m1-coordinator.yml'
  pull_request:
    paths:
      - 'src/current/PCBridgePortable.cs'
      - 'src/current/ScopedBridge.cs'
      - 'src/current/DesktopIntegration.cs'
      - 'src/current/ScopeTests.cs'
      - 'src/current/IntegrationTests.cs'
      - 'src/current/M1Integration.cs'
      - 'src/vnext/M1Automation.cs'
      - 'src/vnext/M1AutomationRuntime.cs'
      - 'src/vnext/M1SessionBinding.cs'
      - 'src/vnext/M1BrowserProfile.cs'
      - 'src/vnext/M1BrowserBroker.cs'
      - 'tests/M1AutomationTests.cs'
      - 'tests/M1AutomationRuntimeTests.cs'
      - 'tests/M1SessionBindingTests.cs'
      - 'tests/M1BrowserProfileTests.cs'
      - 'tests/M1BrowserBrokerTests.cs'
      - 'provider/chatgpt-extension/**'
      - 'tests/m1-browser-companion-contract.mjs'
      - 'scripts/package-m1-companion.ps1'
      - 'scripts/build-m1-local.ps1'
      - '.github/workflows/m1-coordinator.yml'

permissions:
  contents: read

jobs:
  windows-framework-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile M1 coordinator contract tests
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "Framework64 csc.exe not found" }
          $src = (Resolve-Path 'src\vnext\M1Automation.cs').Path
          $test = (Resolve-Path 'tests\M1AutomationTests.cs').Path
          & $csc /nologo /target:exe /platform:x64 /optimize+ /out:M1AutomationTests.exe /reference:System.Web.Extensions.dll /reference:System.Security.dll $src $test
          if ($LASTEXITCODE -ne 0) { throw "M1 coordinator compilation failed" }
      - name: Run M1 coordinator contract tests
        shell: powershell
        run: |
          & .\M1AutomationTests.exe
          if ($LASTEXITCODE -ne 0) { throw "M1 coordinator tests failed" }
      - name: Compile isolated browser profile tests
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src = (Resolve-Path 'src\vnext\M1BrowserProfile.cs').Path
          $test = (Resolve-Path 'tests\M1BrowserProfileTests.cs').Path
          & $csc /nologo /target:exe /platform:x64 /optimize+ /out:M1BrowserProfileTests.exe $src $test
          if ($LASTEXITCODE -ne 0) { throw "M1 browser profile compilation failed" }
      - name: Run isolated browser profile tests
        shell: powershell
        run: |
          & .\M1BrowserProfileTests.exe
          if ($LASTEXITCODE -ne 0) { throw "M1 browser profile tests failed" }

      - name: Run M1 browser companion contract
        shell: powershell
        run: |
          node tests/m1-browser-companion-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw "M1 browser companion contract failed" }

      - name: Compile M1 browser broker tests
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $automation = (Resolve-Path 'src\vnext\M1Automation.cs').Path
          $broker = (Resolve-Path 'src\vnext\M1BrowserBroker.cs').Path
          $test = (Resolve-Path 'tests\M1BrowserBrokerTests.cs').Path
          & $csc /nologo /target:exe /platform:x64 /optimize+ /out:M1BrowserBrokerTests.exe /reference:System.Web.Extensions.dll /reference:System.Security.dll $automation $broker $test
          if ($LASTEXITCODE -ne 0) { throw "M1 browser broker compilation failed" }
      - name: Run M1 browser broker tests
        shell: powershell
        run: |
          & .\M1BrowserBrokerTests.exe
          if ($LASTEXITCODE -ne 0) { throw "M1 browser broker tests failed" }

      - name: Compile M1 session binding tests
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $binding = (Resolve-Path 'src\vnext\M1SessionBinding.cs').Path
          $test = (Resolve-Path 'tests\M1SessionBindingTests.cs').Path
          & $csc /nologo /target:exe /platform:x64 /optimize+ /out:M1SessionBindingTests.exe /reference:System.Web.Extensions.dll /reference:System.Security.dll $binding $test
          if ($LASTEXITCODE -ne 0) { throw "M1 session binding compilation failed" }
      - name: Run M1 session binding tests
        shell: powershell
        run: |
          & .\M1SessionBindingTests.exe
          if ($LASTEXITCODE -ne 0) { throw "M1 session binding tests failed" }

      - name: Compile M1 automation runtime tests
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $automation = (Resolve-Path 'src\vnext\M1Automation.cs').Path
          $binding = (Resolve-Path 'src\vnext\M1SessionBinding.cs').Path
          $profile = (Resolve-Path 'src\vnext\M1BrowserProfile.cs').Path
          $broker = (Resolve-Path 'src\vnext\M1BrowserBroker.cs').Path
          $runtime = (Resolve-Path 'src\vnext\M1AutomationRuntime.cs').Path
          $test = (Resolve-Path 'tests\M1AutomationRuntimeTests.cs').Path
          & $csc /nologo /target:exe /platform:x64 /optimize+ /out:M1AutomationRuntimeTests.exe /reference:System.Web.Extensions.dll /reference:System.Security.dll $automation $binding $profile $broker $runtime $test
          if ($LASTEXITCODE -ne 0) { throw "M1 automation runtime compilation failed" }
      - name: Run M1 automation runtime tests
        shell: powershell
        run: |
          & .\M1AutomationRuntimeTests.exe
          if ($LASTEXITCODE -ne 0) { throw "M1 automation runtime tests failed" }

      - name: Verify reproducible M1 payload and integrated build
        shell: powershell
        run: |
          $bundle = Join-Path $PWD 'ci-bundle'
          $seed = Join-Path $PWD 'ci-payload-seed'
          New-Item -ItemType Directory -Force -Path $bundle,$seed | Out-Null
          Set-Content -LiteralPath (Join-Path $seed 'seed.txt') -Value 'CI base payload' -Encoding ASCII
          Compress-Archive -Path (Join-Path $seed '*') -DestinationPath (Join-Path $bundle 'payload.zip') -Force
          Set-Content -LiteralPath (Join-Path $bundle 'README.txt') -Value 'PCBridge M1 CI resource' -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-m1-local.ps1 -BundleRoot $bundle -RepoRoot $PWD -OutputExe (Join-Path $bundle 'PCBridge-M1-CI.exe')
          if ($LASTEXITCODE -ne 0) { throw "Reproducible M1 package/build script failed" }
          if (-not (Test-Path (Join-Path $bundle 'PCBridge-M1-CI.exe'))) { throw "M1 CI executable missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $bundle 'payload-m1.zip'))
          try {
            $entries = @($zip.Entries | Where-Object { $_.FullName -like 'provider/chatgpt-extension/*' })
            if ($entries.Count -ne 4) { throw "Packaged companion entry count mismatch" }
          } finally {
            $zip.Dispose()
          }
